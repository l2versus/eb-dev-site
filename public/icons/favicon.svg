<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="url(#bg)"/>
  
  <!-- Border glow -->
  <rect x="1" y="1" width="30" height="30" rx="4" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="6" cy="6" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="26" cy="6" r="2" fill="#ff00ff" opacity="0.8"/>
  <circle cx="6" cy="26" r="2" fill="#ff00ff" opacity="0.8"/>
  <circle cx="26" cy="26" r="2" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Code brackets decoration -->
  <text x="5" y="18" font-family="monospace" font-size="7" fill="#00f0ff" opacity="0.3" filter="url(#glow)">&lt;</text>
  <text x="25" y="18" font-family="monospace" font-size="7" fill="#ff00ff" opacity="0.3" filter="url(#glow)">/&gt;</text>
  
  <!-- Main text EB -->
  <text x="50%" y="15" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EB</text>
  
  <!-- Subtitle -->
  <text x="50%" y="22" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="3" fill="#00f0ff" text-anchor="middle" opacity="0.7">DEV</text>
</svg>