<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="19" fill="url(#bg)"/>
  
  <!-- Border glow -->
  <rect x="2" y="2" width="124" height="124" rx="18" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="26" cy="26" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="102" cy="26" r="3" fill="#ff00ff" opacity="0.8"/>
  <circle cx="26" cy="102" r="3" fill="#ff00ff" opacity="0.8"/>
  <circle cx="102" cy="102" r="3" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Code brackets decoration -->
  <text x="19" y="70" font-family="monospace" font-size="27" fill="#00f0ff" opacity="0.3" filter="url(#glow)">&lt;</text>
  <text x="100" y="70" font-family="monospace" font-size="27" fill="#ff00ff" opacity="0.3" filter="url(#glow)">/&gt;</text>
  
  <!-- Main text EB -->
  <text x="50%" y="61" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="45" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EB</text>
  
  <!-- Subtitle -->
  <text x="50%" y="90" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="10" fill="#00f0ff" text-anchor="middle" opacity="0.7">DEV</text>
</svg>