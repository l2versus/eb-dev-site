<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="29" fill="url(#bg)"/>
  
  <!-- Border glow -->
  <rect x="3" y="3" width="186" height="186" rx="27" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="38" cy="38" r="4" fill="#00f0ff" opacity="0.8"/>
  <circle cx="154" cy="38" r="4" fill="#ff00ff" opacity="0.8"/>
  <circle cx="38" cy="154" r="4" fill="#ff00ff" opacity="0.8"/>
  <circle cx="154" cy="154" r="4" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Code brackets decoration -->
  <text x="29" y="106" font-family="monospace" font-size="40" fill="#00f0ff" opacity="0.3" filter="url(#glow)">&lt;</text>
  <text x="150" y="106" font-family="monospace" font-size="40" fill="#ff00ff" opacity="0.3" filter="url(#glow)">/&gt;</text>
  
  <!-- Main text EB -->
  <text x="50%" y="92" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="67" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EB</text>
  
  <!-- Subtitle -->
  <text x="50%" y="134" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="15" fill="#00f0ff" text-anchor="middle" opacity="0.7">DEV</text>
</svg>