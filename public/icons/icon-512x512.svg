<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5.12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="77" fill="url(#bg)"/>
  
  <!-- Border glow -->
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="102" cy="102" r="10" fill="#00f0ff" opacity="0.8"/>
  <circle cx="410" cy="102" r="10" fill="#ff00ff" opacity="0.8"/>
  <circle cx="102" cy="410" r="10" fill="#ff00ff" opacity="0.8"/>
  <circle cx="410" cy="410" r="10" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Code brackets decoration -->
  <text x="77" y="282" font-family="monospace" font-size="107" fill="#00f0ff" opacity="0.3" filter="url(#glow)">&lt;</text>
  <text x="399" y="282" font-family="monospace" font-size="107" fill="#ff00ff" opacity="0.3" filter="url(#glow)">/&gt;</text>
  
  <!-- Main text EB -->
  <text x="50%" y="246" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="179" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EB</text>
  
  <!-- Subtitle -->
  <text x="50%" y="358" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="41" fill="#00f0ff" text-anchor="middle" opacity="0.7">DEV</text>
</svg>