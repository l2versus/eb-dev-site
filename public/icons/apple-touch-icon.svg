<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="27" fill="url(#bg)"/>
  
  <!-- Border glow -->
  <rect x="3" y="3" width="174" height="174" rx="25" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="36" cy="36" r="4" fill="#00f0ff" opacity="0.8"/>
  <circle cx="144" cy="36" r="4" fill="#ff00ff" opacity="0.8"/>
  <circle cx="36" cy="144" r="4" fill="#ff00ff" opacity="0.8"/>
  <circle cx="144" cy="144" r="4" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Code brackets decoration -->
  <text x="27" y="99" font-family="monospace" font-size="38" fill="#00f0ff" opacity="0.3" filter="url(#glow)">&lt;</text>
  <text x="140" y="99" font-family="monospace" font-size="38" fill="#ff00ff" opacity="0.3" filter="url(#glow)">/&gt;</text>
  
  <!-- Main text EB -->
  <text x="50%" y="86" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="63" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EB</text>
  
  <!-- Subtitle -->
  <text x="50%" y="126" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="14" fill="#00f0ff" text-anchor="middle" opacity="0.7">DEV</text>
</svg>