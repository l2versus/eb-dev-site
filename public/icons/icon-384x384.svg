<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.84" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="384" height="384" rx="58" fill="url(#bg)"/>
  
  <!-- Border glow -->
  <rect x="6" y="6" width="372" height="372" rx="54" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="77" cy="77" r="8" fill="#00f0ff" opacity="0.8"/>
  <circle cx="307" cy="77" r="8" fill="#ff00ff" opacity="0.8"/>
  <circle cx="77" cy="307" r="8" fill="#ff00ff" opacity="0.8"/>
  <circle cx="307" cy="307" r="8" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Code brackets decoration -->
  <text x="58" y="211" font-family="monospace" font-size="80" fill="#00f0ff" opacity="0.3" filter="url(#glow)">&lt;</text>
  <text x="300" y="211" font-family="monospace" font-size="80" fill="#ff00ff" opacity="0.3" filter="url(#glow)">/&gt;</text>
  
  <!-- Main text EB -->
  <text x="50%" y="184" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="134" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EB</text>
  
  <!-- Subtitle -->
  <text x="50%" y="269" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="31" fill="#00f0ff" text-anchor="middle" opacity="0.7">DEV</text>
</svg>