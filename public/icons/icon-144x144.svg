<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="144" height="144" rx="22" fill="url(#bg)"/>
  
  <!-- Border glow -->
  <rect x="2" y="2" width="140" height="140" rx="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="29" cy="29" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="115" cy="29" r="3" fill="#ff00ff" opacity="0.8"/>
  <circle cx="29" cy="115" r="3" fill="#ff00ff" opacity="0.8"/>
  <circle cx="115" cy="115" r="3" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Code brackets decoration -->
  <text x="22" y="79" font-family="monospace" font-size="30" fill="#00f0ff" opacity="0.3" filter="url(#glow)">&lt;</text>
  <text x="112" y="79" font-family="monospace" font-size="30" fill="#ff00ff" opacity="0.3" filter="url(#glow)">/&gt;</text>
  
  <!-- Main text EB -->
  <text x="50%" y="69" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="50" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EB</text>
  
  <!-- Subtitle -->
  <text x="50%" y="101" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="12" fill="#00f0ff" text-anchor="middle" opacity="0.7">DEV</text>
</svg>